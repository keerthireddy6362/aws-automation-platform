---
- name: Test AWS authentication
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../group_vars/all/aws_credentials.yml

  tasks:
    - name: Get AWS caller identity
      amazon.aws.aws_caller_info:
        access_key: "{{ aws_access_key }}"
        secret_key: "{{ aws_secret_key }}"
      register: caller

    - name: Display AWS identity
      ansible.builtin.debug:
        msg:
          - "AWS Account: {{ caller.account }}"
          - "AWS ARN: {{ caller.arn }}"
          - "AWS User ID: {{ caller.user_id }}"
