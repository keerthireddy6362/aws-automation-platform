---
- name: Provision AWS infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../group_vars/all/aws_credentials.yml
    - ../group_vars/all/aws.yml

  tasks:

    - name: Create security group
      amazon.aws.ec2_security_group:
        name: automation-platform-sg
        description: Security group for automation platform
        region: "{{ aws_region }}"
        aws_access_key: "{{ aws_access_key }}"
        aws_secret_key: "{{ aws_secret_key }}"

        rules:
          - proto: tcp
            ports:
              - 22
            cidr_ip: 0.0.0.0/0
            rule_desc: SSH access

          - proto: tcp
            ports:
              - 80
            cidr_ip: 0.0.0.0/0
            rule_desc: HTTP access

          - proto: tcp
            ports:
              - 443
            cidr_ip: 0.0.0.0/0
            rule_desc: HTTPS access

      register: security_group

    - name: Create EC2 instance
      amazon.aws.ec2_instance:
        name: "{{ instance_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        key_name: "{{ key_name }}"
        security_group: "{{ security_group.group_id }}"
        region: "{{ aws_region }}"
        aws_access_key: "{{ aws_access_key }}"
        aws_secret_key: "{{ aws_secret_key }}"
        network:
          assign_public_ip: true
        tags:
          Environment: "{{ deployment_environment }}"
          ManagedBy: Ansible
          Project: AWS-Automation-Platform

      register: ec2_instance

    - name: Display EC2 instance information
      ansible.builtin.debug:
        msg:
          - "Instance ID: {{ ec2_instance.instances[0].instance_id }}"
          - "Instance Type: {{ ec2_instance.instances[0].instance_type }}"
          - "Private IP: {{ ec2_instance.instances[0].private_ip_address }}"
          - "Public IP: {{ ec2_instance.instances[0].public_ip_address }}"
          - "State: {{ ec2_instance.instances[0].state.name }}"
