---
- name: Create EC2 key pair
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - ../group_vars/all/aws_credentials.yml
    - ../group_vars/all/aws.yml

  tasks:
    - name: Create EC2 key pair
      amazon.aws.ec2_key:
        name: automation-platform-key
        region: "{{ aws_region }}"
        access_key: "{{ aws_access_key }}"
        secret_key: "{{ aws_secret_key }}"
        state: present
      register: key_pair

    - name: Save private key locally
      ansible.builtin.copy:
        content: "{{ key_pair.key.private_key }}"
        dest: "{{ lookup('env', 'HOME') }}/.ssh/automation-platform-key.pem"
        mode: "0600"
      when: key_pair.changed

    - name: Display key pair status
      ansible.builtin.debug:
        msg: "EC2 key pair automation-platform-key is ready."
